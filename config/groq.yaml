language_hint: bn

subtitle_rules:
  max_chars_per_line: 42
  max_lines_per_card: 2
  min_duration_seconds: 1.0
  max_duration_seconds: 7.0
  max_reading_speed_cps: 17.0

providers:
  transcription: groq
  segmentation: groq
  correction: groq
  tagging: groq
  compliance: groq
  transcription_model: whisper-large-v3-turbo
  text_model: openai/gpt-oss-20b

runtime:
  max_correction_attempts: 2
  request_timeout_seconds: 60
  keep_trace: true
  transcription_chunk_seconds: 90
  transcription_overlap_seconds: 1.5
  text_batch_size: 20

output:
  formats: [srt, vtt, json]
